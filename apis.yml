name: Praxis Labs
description: 'Praxis Labs is an AI-powered leadership and human-skills learning platform,
  surfaced as a portfolio company of Norwest Venture Partners and acquired by Torch.
  Its flagship product, Pivotal Practice, uses immersive simulations, personalized
  AI coaching, and role-play scenarios to build critical management capabilities such
  as difficult conversations and performance discussions, with behavior-change tracking
  and ROI analytics. The learning application runs at practice.praxislabs.co behind
  login and integrates with HR/L&D systems including Workday, Docebo, and Degreed.
  Praxis Labs is SOC 2 Type 2 certified. No public API, developer portal, or SDK was
  found during enrichment; this remains a company profile rather than an API provider.'
